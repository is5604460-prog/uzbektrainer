<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Философия — Тренажёр</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Mulish:wght@300;400;600&display=swap');

:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c28;
  --border: #2a2a3d;
  --accent: #7c6aff;
  --accent2: #b06aff;
  --green: #3ecf8e;
  --red: #ff5c7a;
  --text: #e8e8f0;
  --muted: #6b6b8a;
  --gold: #f5c842;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Mulish', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background grid */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    linear-gradient(rgba(124,106,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124,106,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 20px 16px 80px;
  position: relative;
  z-index: 1;
}

/* Header */
.header {
  text-align: center;
  padding: 32px 0 28px;
}

.header-tag {
  display: inline-block;
  font-family: 'Unbounded', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 4px 12px;
  border-radius: 2px;
  margin-bottom: 16px;
}

.header h1 {
  font-family: 'Unbounded', sans-serif;
  font-size: clamp(22px, 5vw, 36px);
  font-weight: 900;
  line-height: 1.1;
  background: linear-gradient(135deg, #e8e8f0 0%, var(--accent) 60%, var(--accent2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.header-sub {
  color: var(--muted);
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 1px;
}

/* Mode tabs */
.tabs {
  display: flex;
  gap: 6px;
  background: var(--surface);
  padding: 6px;
  border-radius: 12px;
  border: 1px solid var(--border);
  margin-bottom: 24px;
}

.tab {
  flex: 1;
  padding: 10px 8px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: 'Mulish', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
}

.tab.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0 20px rgba(124,106,255,0.4);
}

/* Stats bar */
.stats-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding: 12px 16px;
  background: var(--surface);
  border-radius: 10px;
  border: 1px solid var(--border);
}

.stat {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
}

.stat-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.stat.correct .stat-dot { background: var(--green); }
.stat.wrong .stat-dot { background: var(--red); }

.progress-wrap {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px;
  transition: width 0.4s ease;
  width: 0%;
}

.q-counter {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

/* Question card */
.question-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 24px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}

.question-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
}

.q-num {
  font-family: 'Unbounded', sans-serif;
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 2px;
  margin-bottom: 12px;
  display: block;
}

.q-text {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.5;
  color: var(--text);
}

/* Answer options */
.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 16px;
}

.option {
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Mulish', sans-serif;
  font-size: 14px;
  font-weight: 400;
  text-align: left;
  cursor: pointer;
  transition: all 0.18s;
  line-height: 1.4;
}

.option:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--surface2);
  transform: translateX(3px);
}

.option.correct {
  border-color: var(--green);
  background: rgba(62,207,142,0.1);
  color: var(--green);
  font-weight: 600;
}

.option.wrong {
  border-color: var(--red);
  background: rgba(255,92,122,0.1);
  color: var(--red);
}

.option:disabled {
  cursor: default;
}

/* Controls */
.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
}

.btn {
  flex: 1;
  padding: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-family: 'Mulish', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
}

.btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 0 20px rgba(124,106,255,0.3);
}

.btn.primary:hover {
  background: var(--accent2);
  border-color: var(--accent2);
  color: #fff;
  box-shadow: 0 0 30px rgba(176,106,255,0.4);
}

/* Next button */
.next-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  border-radius: 12px;
  color: #fff;
  font-family: 'Unbounded', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  margin-bottom: 16px;
  transition: all 0.2s;
  box-shadow: 0 4px 20px rgba(124,106,255,0.35);
  display: none;
}

.next-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(124,106,255,0.5);
}

/* Result screen */
.result-screen {
  text-align: center;
  padding: 48px 24px;
  display: none;
}

.result-emoji {
  font-size: 64px;
  margin-bottom: 16px;
}

.result-score {
  font-family: 'Unbounded', sans-serif;
  font-size: 48px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.result-label {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 32px;
}

/* LEARN mode */
.learn-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.learn-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

.learn-q {
  padding: 16px 18px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  transition: background 0.15s;
}

.learn-q:hover {
  background: var(--surface2);
}

.learn-q-num {
  font-family: 'Unbounded', sans-serif;
  font-size: 9px;
  color: var(--accent);
  letter-spacing: 1px;
  white-space: nowrap;
  padding-top: 2px;
}

.learn-chevron {
  color: var(--muted);
  font-size: 12px;
  transition: transform 0.2s;
  flex-shrink: 0;
  padding-top: 2px;
}

.learn-item.open .learn-chevron {
  transform: rotate(180deg);
}

.learn-answer {
  display: none;
  padding: 0 18px 16px;
  border-top: 1px solid var(--border);
  margin-top: 0;
}

.learn-item.open .learn-answer {
  display: block;
}

.learn-correct {
  color: var(--green);
  font-weight: 700;
  font-size: 14px;
  padding: 10px 0 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.learn-correct::before {
  content: '✓';
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  background: rgba(62,207,142,0.15);
  border-radius: 50%;
  font-size: 10px;
  flex-shrink: 0;
}

.learn-wrong-list {
  margin-top: 4px;
}

.learn-wrong-item {
  color: var(--muted);
  font-size: 13px;
  padding: 3px 0;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  line-height: 1.4;
}

.learn-wrong-item::before {
  content: '✗';
  color: var(--red);
  opacity: 0.5;
  font-size: 10px;
  padding-top: 2px;
  flex-shrink: 0;
}

/* Empty errors */
.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--muted);
}

.empty-state .empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
}

.empty-state p {
  font-size: 15px;
}

/* Search */
.search-wrap {
  margin-bottom: 16px;
}

.search-input {
  width: 100%;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'Mulish', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}

.search-input:focus {
  border-color: var(--accent);
}

.search-input::placeholder {
  color: var(--muted);
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.question-card, .options, .learn-item {
  animation: fadeIn 0.25s ease;
}

</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-tag">Quiz Trainer</div>
    <h1>Философия</h1>
    <div class="header-sub">Итоговые тесты · 2025</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-quiz">Тест</button>
    <button class="tab" id="tab-learn">Учить</button>
    <button class="tab" id="tab-errors">Ошибки</button>
  </div>

  <!-- QUIZ MODE -->
  <div id="mode-quiz">
    <div class="stats-bar">
      <div class="stat correct">
        <div class="stat-dot"></div>
        <span id="count-correct">0</span>
      </div>
      <div class="stat wrong">
        <div class="stat-dot"></div>
        <span id="count-wrong">0</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="q-counter" id="q-counter">1 / 400</div>
    </div>

    <div class="controls">
      <button class="btn" id="btn-restart">↺ Заново</button>
      <button class="btn" id="btn-shuffle">⇄ Перемешать</button>
    </div>

    <div id="quiz-main">
      <div class="question-card">
        <span class="q-num" id="q-num">ВОПРОС 1</span>
        <div class="q-text" id="q-text"></div>
      </div>
      <div class="options" id="options-list"></div>
      <button class="next-btn" id="next-btn">СЛЕДУЮЩИЙ ВОПРОС →</button>
    </div>

    <div class="result-screen" id="result-screen">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-score" id="result-score"></div>
      <div class="result-label" id="result-label"></div>
      <button class="btn primary" id="btn-again" style="max-width:280px;margin:0 auto;display:block;">Пройти ещё раз</button>
    </div>
  </div>

  <!-- LEARN MODE -->
  <div id="mode-learn" style="display:none">
    <div class="search-wrap">
      <input class="search-input" id="search-input" type="text" placeholder="Поиск по вопросам...">
    </div>
    <div class="learn-list" id="learn-list"></div>
  </div>

  <!-- ERRORS MODE -->
  <div id="mode-errors" style="display:none">
    <div class="controls">
      <button class="btn" id="btn-errors-restart">↺ Заново</button>
    </div>
    <div id="errors-main"></div>
  </div>

</div>

<script>
const ALL_QUESTIONS = [{"q": "Автором термина «пассионарность» является?", "correct": "Л. Гумилев", "wrong": ["Н. Бердяев", "В. Соловьев", "А. Тойнби"]}, {"q": "Базис по формационной теории это?", "correct": "экономические отношения", "wrong": ["политика", "социум", "философия"]}, {"q": "Надстройка по формационной теории это?", "correct": "социум и государство", "wrong": ["искусство", "живопись", "музыка"]}, {"q": "Родоначальником цивилизационной теории является?", "correct": "Н. Данилевский", "wrong": ["А. Лосев", "Н. Харрари", "Н. Бостром"]}, {"q": "Что означает «циклическая концепция истории»?", "correct": "повторяемость событий в том или ином аспекте", "wrong": ["прогресс", "линейность", "случайность"]}, {"q": "Что такое исторический оптимизм?", "correct": "вера в прогрессивное развитие человечества", "wrong": ["скепсис", "релятивизм", "нигилизм"]}, {"q": "Какой философ писал о «конце истории» как о завершении идеологической борьбы?", "correct": "Ф. Фукуяма", "wrong": ["М. Хайдеггер", "Ф. Ницше", "К. Маркс"]}, {"q": "Что означает термин «историософия»?", "correct": "Философское осмысление истории", "wrong": ["Хронология", "Археология", "География"]}, {"q": "Какой философ ввел понятие «осевое время»?", "correct": "Ясперс", "wrong": ["Шпенглер", "Маркс", "Тойнби"]}, {"q": "Какой философ считал, что цивилизации подобны живым организмам?", "correct": "Шпенглер", "wrong": ["Бостром", "Аристотель", "Лосев"]}, {"q": "Кто ввел понятие «локальные цивилизации»?", "correct": "Данилевский", "wrong": ["Тойнби", "Шпенглер", "Маркс"]}, {"q": "Какое понятие противоположно исторической необходимости?", "correct": "случайность", "wrong": ["свобода", "закономерность", "рациональность"]}, {"q": "Что означает историческая закономерность?", "correct": "повторяемость и необходимость событий", "wrong": ["случай", "личное мнение", "эмоции"]}, {"q": "Что означает «линейная концепция истории»?", "correct": "движение от начала к концу по прямой", "wrong": ["круговорот", "случайные события"   for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleOptions(q) {
  const opts = [q.correct, ...q.wrong.slice(0, 3)];
  return shuffle(opts);
}

// ---- QUIZ MODE ----
function renderQuestion() {
  const q = questions[current];
  const total = questions.length;
  document.getElementById('q-num').textContent = 'ВОПРОС ' + (current + 1);
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-counter').textContent = (current + 1) + ' / ' + total;
  document.getElementById('progress-fill').style.width = ((current / total) * 100) + '%';
  document.getElementById('count-correct').textContent = correctCount;
  document.getElementById('count-wrong').textContent = wrongCount;
  document.getElementById('next-btn').style.display = 'none';
  answered = false;

  const opts = shuffleOptions(q);
  const list = document.getElementById('options-list');
  list.innerHTML = '';
  opts.forEach(function(opt) {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', function() { selectAnswer(opt, q, btn, list); });
    list.appendChild(btn);
  });
}

function selectAnswer(selected, q, btn, list) {
  if (answered) return;
  answered = true;
  const isCorrect = selected === q.correct;
  if (isCorrect) {
    correctCount++;
    btn.classList.add('correct');
  } else {
    wrongCount++;
    btn.classList.add('wrong');
    errors.push(q);
    // Show correct
    list.querySelectorAll('.option').forEach(function(b) {
      if (b.textContent === q.correct) b.classList.add('correct');
    });
  }
  list.querySelectorAll('.option').forEach(function(b) { b.disabled = true; });
  document.getElementById('count-correct').textContent = correctCount;
  document.getElementById('count-wrong').textContent = wrongCount;

  const total = questions.length;
  if (current + 1 >= total) {
    setTimeout(showResult, 800);
  } else {
    document.getElementById('next-btn').style.display = 'block';
  }
}

function showResult() {
  document.getElementById('quiz-main').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';
  const pct = Math.round((correctCount / questions.length) * 100);
  document.getElementById('result-score').textContent = pct + '%';
  document.getElementById('result-label').textContent = correctCount + ' правильных из ' + questions.length;
  document.getElementById('result-emoji').textContent = pct >= 80 ? '🎉' : pct >= 60 ? '📚' : '💪';
}

function restartQuiz() {
  current = 0; correctCount = 0; wrongCount = 0; errors = [];
  document.getElementById('quiz-main').style.display = 'block';
  document.getElementById('result-screen').style.display = 'none';
  renderQuestion();
}

document.getElementById('next-btn').addEventListener('click', function() {
  current++;
  renderQuestion();
});

document.getElementById('btn-restart').addEventListener('click', restartQuiz);
document.getElementById('btn-shuffle').addEventListener('click', function() {
  questions = shuffle(ALL_QUESTIONS);
  restartQuiz();
});
document.getElementById('btn-again').addEventListener('click', function() {
  questions = [...ALL_QUESTIONS];
  restartQuiz();
});

// ---- LEARN MODE ----
function renderLearn(filter) {
  filter = (filter || '').toLowerCase();
  const list = document.getElementById('learn-list');
  list.innerHTML = '';
  ALL_QUESTIONS.forEach(function(q, i) {
    if (filter && q.q.toLowerCase().indexOf(filter) === -1) return;
    const item = document.createElement('div');
    item.className = 'learn-item';
    
    const qDiv = document.createElement('div');
    qDiv.className = 'learn-q';
    qDiv.innerHTML = '<span class="learn-q-num">' + (i+1) + '</span><span style="flex:1">' + escHtml(q.q) + '</span><span class="learn-chevron">▼</span>';
    
    const ansDiv = document.createElement('div');
    ansDiv.className = 'learn-answer';
    ansDiv.innerHTML = '<div class="learn-correct">' + escHtml(q.correct) + '</div>' +
      '<div class="learn-wrong-list">' +
      q.wrong.slice(0,3).map(function(w){ return '<div class="learn-wrong-item">' + escHtml(w) + '</div>'; }).join('') +
      '</div>';
    
    qDiv.addEventListener('click', function() {
      item.classList.toggle('open');
    });
    
    item.appendChild(qDiv);
    item.appendChild(ansDiv);
    list.appendChild(item);
  });
}

document.getElementById('search-input').addEventListener('input', function() {
  renderLearn(this.value);
});

// ---- ERRORS MODE ----
function renderErrorsMode() {
  errorQuestions = [...errors];
  errorCurrent = 0; errorCorrect = 0; errorWrong = 0; errorAnswered = false;
  const main = document.getElementById('errors-main');
  
  if (errorQuestions.length === 0) {
    main.innerHTML = '<div class="empty-state"><div class="empty-icon">✨</div><p>Ошибок нет! Сначала пройди тест.</p></div>';
    return;
  }
  renderErrorQuestion();
}

function renderErrorQuestion() {
  const main = document.getElementById('errors-main');
  if (errorCurrent >= errorQuestions.length) {
    const pct = Math.round((errorCorrect / errorQuestions.length) * 100);
    main.innerHTML = '<div class="result-screen" style="display:block"><div class="result-emoji">' + (pct>=80?'🎉':'📚') + '</div><div class="result-score">' + pct + '%</div><div class="result-label">' + errorCorrect + ' из ' + errorQuestions.length + ' ошибок исправлено</div></div>';
    return;
  }
  const q = errorQuestions[errorCurrent];
  const opts = shuffleOptions(q);
  
  main.innerHTML = 
    '<div class="stats-bar"><div class="stat correct"><div class="stat-dot"></div><span>' + errorCorrect + '</span></div>' +
    '<div class="stat wrong"><div class="stat-dot"></div><span>' + errorWrong + '</span></div>' +
    '<div class="progress-wrap"><div class="progress-fill" style="width:' + ((errorCurrent/errorQuestions.length)*100) + '%"></div></div>' +
    '<div class="q-counter">' + (errorCurrent+1) + ' / ' + errorQuestions.length + '</div></div>' +
    '<div class="question-card"><span class="q-num">ОШИБКА ' + (errorCurrent+1) + '</span><div class="q-text">' + escHtml(q.q) + '</div></div>' +
    '<div class="options" id="err-options"></div>' +
    '<button class="next-btn" id="err-next" style="display:none">СЛЕДУЮЩИЙ →</button>';
  
  const optList = document.getElementById('err-options');
  opts.forEach(function(opt) {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', function() {
      if (errorAnswered) return;
      errorAnswered = true;
      const ok = opt === q.correct;
      if (ok) { errorCorrect++; btn.classList.add('correct'); }
      else {
        errorWrong++; btn.classList.add('wrong');
        optList.querySelectorAll('.option').forEach(function(b){ if(b.textContent===q.correct) b.classList.add('correct'); });
      }
      optList.querySelectorAll('.option').forEach(function(b){ b.disabled=true; });
      if (errorCurrent + 1 >= errorQuestions.length) {
        setTimeout(function(){
          errorCurrent++;
          renderErrorQuestion();
        }, 800);
      } else {
        document.getElementById('err-next').style.display = 'block';
      }
    });
    optList.appendChild(btn);
  });
  
  document.getElementById('err-next').addEventListener('click', function() {
    errorCurrent++; errorAnswered = false;
    renderErrorQuestion();
  });
}

document.getElementById('btn-errors-restart').addEventListener('click', renderErrorsMode);

// ---- TABS ----
function setMode(mode) {
  ['quiz','learn','errors'].forEach(function(m) {
    document.getElementById('mode-' + m).style.display = m === mode ? 'block' : 'none';
    document.getElementById('tab-' + m).classList.toggle('active', m === mode);
  });
  if (mode === 'learn') renderLearn('');
  if (mode === 'errors') renderErrorsMode();
}

document.getElementById('tab-quiz').addEventListener('click', function(){ setMode('quiz'); });
document.getElementById('tab-learn').addEventListener('click', function(){ setMode('learn'); });
document.getElementById('tab-errors').addEventListener('click', function(){ setMode('errors'); });

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Init
renderQuestion();
</script>
</body>
</html>
